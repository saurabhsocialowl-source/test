# nginx reverse proxy for the Couch signaling server, terminating TLS and
# upgrading WebSocket. Point a dedicated subdomain at it, e.g. signal.example.com.
#
# 1. DNS: A record signal.example.com -> your server IP
# 2. TLS: certbot --nginx -d signal.example.com   (or reuse your existing cert)
# 3. Put this in /etc/nginx/sites-available/ and symlink to sites-enabled, then
#    sudo nginx -t && sudo systemctl reload nginx
#
# The extension then uses broker host:  signal.example.com   (port 443, wss)

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name signal.example.com;

  # Reuse your existing Let's Encrypt cert paths:
  ssl_certificate     /etc/letsencrypt/live/signal.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/signal.example.com/privkey.pem;

  location / {
    proxy_pass http://127.0.0.1:9000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;   # keep long-lived signaling sockets open
    proxy_send_timeout 3600s;
  }
}

# Optional: redirect http -> https
server {
  listen 80;
  listen [::]:80;
  server_name signal.example.com;
  return 301 https://$host$request_uri;
}
