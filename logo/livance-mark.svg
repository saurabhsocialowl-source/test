<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0FB5A3"/>
      <stop offset="100%" stop-color="#0A7A6E"/>
    </linearGradient>
    <linearGradient id="markGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E6FFFB"/>
    </linearGradient>
  </defs>

  <!-- Rounded square badge -->
  <rect x="60" y="60" width="960" height="960" rx="220" ry="220" fill="url(#bgGrad)"/>

  <!-- Stylized "L" with heartbeat pulse forming the horizontal leg -->
  <g fill="none" stroke="url(#markGrad)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Vertical stroke of L -->
    <path d="M 360 280 L 360 720" stroke-width="90"/>
    <!-- Heartbeat horizontal line continuing from L -->
    <path d="M 360 720 L 520 720 L 580 600 L 660 820 L 740 660 L 800 720 L 880 720"
          stroke-width="64"/>
  </g>
</svg>
